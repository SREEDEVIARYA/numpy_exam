<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>{% block title %}NumPy Exam{% endblock %}</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" href="{{ url_for('static',filename='style.css') }}"></head><body><nav class="navbar navbar-dark bg-dark"><div class="container"><a class="navbar-brand" href="/">NumPy Exam Portal</a>{% if session.get('student_id') %}<span class="text-white">{{ session.get('username') }} <a class="btn btn-sm btn-outline-light ms-2" href="/logout">Logout</a></span>{% endif %}</div></nav><main class="container py-4">{% with msgs=get_flashed_messages(with_categories=true) %}{% for cat,msg in msgs %}<div class="alert alert-{{cat}}">{{msg}}</div>{% endfor %}{% endwith %}{% block content %}{% endblock %}</main></body></html>
