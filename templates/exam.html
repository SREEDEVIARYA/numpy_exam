{% extends "base.html" %}{% block content %}<h2>NumPy Examination</h2><p>Choose one answer per question. Each correct answer carries 1 mark.</p><form method="post" onsubmit="return confirm('Submit your exam? You cannot retake it using this account.');">{% for q in questions %}<div class="question"><h5>{{q.id}}. {{q.question}}</h5>{% for op in q.options %}<label class="d-block py-1"><input type="radio" name="q{{q.id}}" value="{{'ABCD'[loop.index0]}}"> {{'ABCD'[loop.index0]}}. {{op}}</label>{% endfor %}</div>{% endfor %}<button class="btn btn-success btn-lg">Submit exam</button></form>{% endblock %}
